# Đưa Zalo Multi vào https://<domain>/app/ (đặt trong server {} của site, ví dụ /etc/nginx/site-extra/<domain>/zalo-multi.conf)
location = /app { return 301 /app/; }
location ^~ /app/ {
    proxy_pass http://127.0.0.1:8788;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    # SSE (tin nhắn realtime): không đệm, giữ kết nối lâu
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    # ảnh gửi đi dạng base64 trong JSON
    client_max_body_size 30m;
    include snippets/headers.conf;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; media-src https:; connect-src 'self'; style-src 'self'; script-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
}
